<!DOCTYPE html>
<html>
<head>
    <title>Sanju-AI Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #1a1a2e; color: white; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        h1 { text-align: center; padding: 20px; color: #00d2ff; }
        #chat { height: 500px; overflow-y: auto; background: #16213e;
                border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .msg { margin: 10px 0; padding: 10px; border-radius: 8px;
               white-space: pre-wrap; word-wrap: break-word; line-height: 1.6; }
        .user { background: #0f3460; text-align: right; }
        .bot { background: #1a1a40; }
        .err { background: #4a1a1a; color: #ff6b6b; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none;
                font-size: 16px; }
        button { padding: 12px 24px; background: #00d2ff; border: none;
                 border-radius: 8px; color: black; font-weight: bold;
                 cursor: pointer; font-size: 16px; }
        button:hover { background: #00b4d8; }
        button:disabled { background: #555; cursor: not-allowed; }
        .status { text-align: center; color: #888; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Sanju-AI Assistant</h1>
        <div id="chat">
            <div class="msg bot">🤖 Hi! I'm Sanju-AI. Ask me anything! (First reply may take 30-60 seconds while model loads)</div>
        </div>
        <div class="input-area">
            <input id="input" placeholder="Ask Sanju-AI anything..."
                   onkeypress="if(event.key==='Enter')sendMsg()">
            <button id="btn" onclick="sendMsg()">Send</button>
        </div>
        <div class="status">Powered by Sanju-AI (FREE)</div>
    </div>
    <script>
        const chat = document.getElementById('chat');
        const btn = document.getElementById('btn');

        // PASTE YOUR NEW HUGGINGFACE TOKEN BELOW
        const TOKEN = "";

        // Small models that are always available on free tier
        const MODELS = [
            "microsoft/DialoGPT-large",
            "facebook/blenderbot-400M-distill",
            "HuggingFaceH4/zephyr-7b-beta",
            "mistralai/Mistral-7B-Instruct-v0.3",
            "google/flan-t5-large"
        ];

        async function tryModel(model, prompt) {
            const r = await fetch("https://api-inference.huggingface.co/models/" + model, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + TOKEN
                },
                body: JSON.stringify({
                    inputs: prompt,
                    parameters: { max_new_tokens: 500, temperature: 0.7 },
                    options: { wait_for_model: true }
                })
            });

            if (!r.ok) throw new Error("Model " + model + " failed");

            const data = await r.json();

            if (data.error) throw new Error(data.error);

            // Different models return different formats
            if (Array.isArray(data)) {
                if (data[0]?.generated_text) {
                    let text = data[0].generated_text;
                    // Remove the prompt from response if included
                    if (text.includes("[/INST]")) text = text.split("[/INST]").pop();
                    if (text.includes("Assistant:")) text = text.split("Assistant:").pop();
                    return text.trim();
                }
                if (data[0]?.translation_text) return data[0].translation_text;
            }
            if (data.generated_text) return data.generated_text;

            throw new Error("No valid response");
        }

        async function sendMsg() {
            const input = document.getElementById('input');
            const q = input.value.trim();
            if (!q) return;

            btn.disabled = true;
            btn.textContent = 'Thinking...';
            chat.innerHTML += '<div class="msg user">👤 ' + q + '</div>';
            input.value = '';
            chat.innerHTML += '<div class="msg bot" id="loading">🤖 Thinking... (first time may take 30-60 sec)</div>';
            chat.scrollTop = chat.scrollHeight;

            const prompt = "<s>[INST] You are Sanju-AI, a helpful assistant created by Sandeep. Be friendly and clear. " + q + " [/INST]";

            let answered = false;

            for (let i = 0; i < MODELS.length; i++) {
                if (answered) break;
                try {
                    const answer = await tryModel(MODELS[i], prompt);
                    if (answer && answer.length > 2) {
                        document.getElementById('loading')?.remove();
                        chat.innerHTML += '<div class="msg bot">🤖 ' + answer + '</div>';
                        answered = true;
                    }
                } catch(e) {
                    console.log("Model " + MODELS[i] + " failed: " + e.message);
                }
            }

            if (!answered) {
                document.getElementById('loading')?.remove();
                chat.innerHTML += '<div class="msg err">⚠️ All models are loading. Please wait 30 seconds and try again. (This is normal for first use)</div>';
            }

            btn.disabled = false;
            btn.textContent = 'Send';
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
