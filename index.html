<!DOCTYPE html>
<html>
<head>
    <title>Sanju - AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #1a1a2e; color: white; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        h1 { text-align: center; padding: 20px; color: #00d2ff; }
        #chat { height: 500px; overflow-y: auto; background: #16213e;
                border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .msg { margin: 10px 0; padding: 10px; border-radius: 8px;
               white-space: pre-wrap; word-wrap: break-word; line-height: 1.5; }
        .user { background: #0f3460; text-align: right; }
        .bot { background: #1a1a40; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none;
                font-size: 16px; }
        button { padding: 12px 24px; background: #00d2ff; border: none;
                 border-radius: 8px; color: black; font-weight: bold;
                 cursor: pointer; font-size: 16px; }
        button:hover { background: #00b4d8; }
        button:disabled { background: #555; cursor: not-allowed; }
        .status { text-align: center; color: #888; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 EVA - AI Assistant</h1>
        <div id="chat">
            <div class="msg bot">🤖 Hi! I'm EVA, your AI assistant. Ask me anything!</div>
        </div>
        <div class="input-area">
            <input id="input" placeholder="Ask me anything..."
                   onkeypress="if(event.key==='Enter')sendMsg()">
            <button id="btn" onclick="sendMsg()">Send</button>
        </div>
        <div class="status">Powered by Free AI</div>
    </div>
    <script>
        const chat = document.getElementById('chat');
        const btn = document.getElementById('btn');
        let history = [];

        async function sendMsg() {
            const input = document.getElementById('input');
            const q = input.value.trim();
            if (!q) return;

            btn.disabled = true;
            btn.textContent = '...';
            chat.innerHTML += '<div class="msg user">👤 ' + q + '</div>';
            input.value = '';
            chat.innerHTML += '<div class="msg bot" id="loading">🤖 Thinking...</div>';
            chat.scrollTop = chat.scrollHeight;

            history.push({ role: "user", content: q });

            try {
                // Using free DuckDuckGo AI API
                const r = await fetch("https://api.duckduckgo.com/duckchat/v1/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-vqd-accept": "1"
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { role: "system", content: "You are EVA, a helpful AI assistant created by Sandeep. You help with coding, automation testing, Playwright, C#, and general questions. Be friendly and helpful." },
                            ...history
                        ]
                    })
                });

                // If DuckDuckGo fails, try backup
                if (!r.ok) {
                    throw new Error("Primary API failed");
                }

                const text = await r.text();
                const lines = text.split('\n').filter(l => l.startsWith('data:'));
                let answer = '';
                for (const line of lines) {
                    try {
                        const json = JSON.parse(line.replace('data: ', ''));
                        if (json.message) answer += json.message;
                    } catch(e) {}
                }

                document.getElementById('loading').remove();
                if (answer) {
                    history.push({ role: "assistant", content: answer });
                    chat.innerHTML += '<div class="msg bot">🤖 ' + answer + '</div>';
                } else {
                    throw new Error("No answer");
                }
            } catch(e) {
                document.getElementById('loading')?.remove();
                // Backup: Use free Pollinations AI
                try {
                    const backup = await fetch("https://text.pollinations.ai/" + encodeURIComponent(
                        "You are EVA, a helpful AI assistant. " + q
                    ));
                    const answer = await backup.text();
                    history.push({ role: "assistant", content: answer });
                    chat.innerHTML += '<div class="msg bot">🤖 ' + answer + '</div>';
                } catch(e2) {
                    chat.innerHTML += '<div class="msg bot">🤖 Sorry, please try again in a moment.</div>';
                }
            }
            btn.disabled = false;
            btn.textContent = 'Send';
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
