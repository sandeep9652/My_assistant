<!DOCTYPE html>
<html>
<head>
    <title>Sanju-AI Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #1a1a2e; color: white; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        h1 { text-align: center; padding: 20px; color: #00d2ff; }
        #chat { height: 500px; overflow-y: auto; background: #16213e;
                border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .msg { margin: 10px 0; padding: 10px; border-radius: 8px;
               white-space: pre-wrap; word-wrap: break-word; line-height: 1.6; }
        .user { background: #0f3460; text-align: right; }
        .bot { background: #1a1a40; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none;
                font-size: 16px; }
        button { padding: 12px 24px; background: #00d2ff; border: none;
                 border-radius: 8px; color: black; font-weight: bold;
                 cursor: pointer; font-size: 16px; }
        button:hover { background: #00b4d8; }
        button:disabled { background: #555; cursor: not-allowed; }
        .status { text-align: center; color: #888; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Sanju-AI Assistant</h1>
        <div id="chat">
            <div class="msg bot">🤖 Hi! I'm Sanju-AI, your AI assistant. Ask me anything!</div>
        </div>
        <div class="input-area">
            <input id="input" placeholder="Ask Sanju-AI anything..."
                   onkeypress="if(event.key==='Enter')sendMsg()">
            <button id="btn" onclick="sendMsg()">Send</button>
        </div>
        <div class="status">Powered by Sanju-AI (FREE)</div>
    </div>
    <script>
        const chat = document.getElementById('chat');
        const btn = document.getElementById('btn');
        const messages = [
            { role: "system", content: "You are Sanju-AI, a helpful AI assistant created by Sandeep. You help with coding, automation testing, Playwright, C#, and general questions. Be friendly and helpful." }
        ];

        async function sendMsg() {
            const input = document.getElementById('input');
            const q = input.value.trim();
            if (!q) return;

            btn.disabled = true;
            btn.textContent = 'Thinking...';
            chat.innerHTML += '<div class="msg user">👤 ' + q + '</div>';
            input.value = '';
            chat.innerHTML += '<div class="msg bot" id="loading">🤖 Thinking... (10-20 seconds)</div>';
            chat.scrollTop = chat.scrollHeight;

            messages.push({ role: "user", content: q });

            let answered = false;

            // API 1: DeepInfra (FREE, no token)
            if (!answered) {
                try {
                    const r = await fetch("https://api.deepinfra.com/v1/openai/chat/completions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "meta-llama/Meta-Llama-3.1-8B-Instruct",
                            messages: messages,
                            max_tokens: 800
                        })
                    });
                    if (r.ok) {
                        const data = await r.json();
                        const answer = data.choices?.[0]?.message?.content;
                        if (answer) {
                            document.getElementById('loading')?.remove();
                            messages.push({ role: "assistant", content: answer });
                            chat.innerHTML += '<div class="msg bot">🤖 ' + answer + '</div>';
                            answered = true;
                        }
                    }
                } catch(e) {}
            }

            // API 2: Groq Free API
            if (!answered) {
                try {
                    const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Bearer gsk_free"
                        },
                        body: JSON.stringify({
                            model: "llama3-8b-8192",
                            messages: messages,
                            max_tokens: 800
                        })
                    });
                    if (r.ok) {
                        const data = await r.json();
                        const answer = data.choices?.[0]?.message?.content;
                        if (answer) {
                            document.getElementById('loading')?.remove();
                            messages.push({ role: "assistant", content: answer });
                            chat.innerHTML += '<div class="msg bot">🤖 ' + answer + '</div>';
                            answered = true;
                        }
                    }
                } catch(e) {}
            }

            // API 3: Blackbox AI (FREE)
            if (!answered) {
                try {
                    const r = await fetch("https://www.blackbox.ai/api/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            messages: messages,
                            previewToken: null,
                            codeModelMode: true,
                            agentMode: {},
                            trendingAgentMode: {}
                        })
                    });
                    if (r.ok) {
                        const answer = await r.text();
                        if (answer && answer.length > 5) {
                            document.getElementById('loading')?.remove();
                            messages.push({ role: "assistant", content: answer });
                            chat.innerHTML += '<div class="msg bot">🤖 ' + answer + '</div>';
                            answered = true;
                        }
                    }
                } catch(e) {}
            }

            // API 4: ChatGPT Clone (FREE)
            if (!answered) {
                try {
                    const prompt = messages.map(m => m.content).join('\n');
                    const r = await fetch("https://free.churchless.tech/v1/chat/completions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "gpt-3.5-turbo",
                            messages: messages,
                            max_tokens: 800
                        })
                    });
                    if (r.ok) {
                        const data = await r.json();
                        const answer = data.choices?.[0]?.message?.content;
                        if (answer) {
                            document.getElementById('loading')?.remove();
                            messages.push({ role: "assistant", content: answer });
                            chat.innerHTML += '<div class="msg bot">🤖 ' + answer + '</div>';
                            answered = true;
                        }
                    }
                } catch(e) {}
            }

            // If ALL APIs fail
            if (!answered) {
                document.getElementById('loading')?.remove();
                chat.innerHTML += '<div class="msg bot">🤖 All servers are busy right now. Please try again in 1 minute.</div>';
                messages.pop(); // remove failed user message
            }

            btn.disabled = false;
            btn.textContent = 'Send';
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
