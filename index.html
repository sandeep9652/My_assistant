<!DOCTYPE html>
<html>
<head>
    <title>Sanju-AI Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #1a1a2e; color: white; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        h1 { text-align: center; padding: 20px; color: #00d2ff; }
        #chat { height: 500px; overflow-y: auto; background: #16213e;
                border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .msg { margin: 10px 0; padding: 10px; border-radius: 8px;
               white-space: pre-wrap; word-wrap: break-word; line-height: 1.6; }
        .user { background: #0f3460; text-align: right; }
        .bot { background: #1a1a40; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none;
                font-size: 16px; }
        button { padding: 12px 24px; background: #00d2ff; border: none;
                 border-radius: 8px; color: black; font-weight: bold;
                 cursor: pointer; font-size: 16px; }
        button:hover { background: #00b4d8; }
        button:disabled { background: #555; cursor: not-allowed; }
        .status { text-align: center; color: #888; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Sanju-AI Assistant</h1>
        <div id="chat">
            <div class="msg bot">🤖 Hi! I'm Sanju-AI, your AI assistant created by Sandeep. Ask me anything!</div>
        </div>
        <div class="input-area">
            <input id="input" placeholder="Ask Sanju-AI anything..."
                   onkeypress="if(event.key==='Enter')sendMsg()">
            <button id="btn" onclick="sendMsg()">Send</button>
        </div>
        <div class="status">Powered by Sanju-AI (FREE)</div>
    </div>
    <script>
        const chat = document.getElementById('chat');
        const btn = document.getElementById('btn');

        async function sendMsg() {
            const input = document.getElementById('input');
            const q = input.value.trim();
            if (!q) return;

            btn.disabled = true;
            btn.textContent = 'Thinking...';
            chat.innerHTML += '<div class="msg user">👤 ' + q + '</div>';
            input.value = '';
            chat.innerHTML += '<div class="msg bot" id="loading">🤖 Sanju-AI is thinking... (may take 10-15 seconds)</div>';
            chat.scrollTop = chat.scrollHeight;

            const systemPrompt = "You are Sanju-AI, a helpful AI assistant created by Sandeep. You help with coding, automation testing, Playwright, C#, and general questions. Be friendly, clear and helpful. Give detailed answers. Always introduce yourself as Sanju-AI when asked.";
            
            const fullPrompt = systemPrompt + " User asks: " + q;
            const url = "https://text.pollinations.ai/" + encodeURIComponent(fullPrompt) + "?nologo=true";

            try {
                const r = await fetch(url);
                document.getElementById('loading')?.remove();

                if (r.ok) {
                    const answer = await r.text();
                    chat.innerHTML += '<div class="msg bot">🤖 ' + answer + '</div>';
                } else {
                    chat.innerHTML += '<div class="msg bot">🤖 Server busy. Please try again.</div>';
                }
            } catch(e) {
                document.getElementById('loading')?.remove();
                chat.innerHTML += '<div class="msg bot">🤖 Network error. Please try again.</div>';
            }

            btn.disabled = false;
            btn.textContent = 'Send';
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
